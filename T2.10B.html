<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>T2.10B — Lower Level — North | St. Ignatius Security</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111820;
      color: #e8edf2;
      font-family: Arial, sans-serif;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Top bar ── */
    #topbar {
      flex-shrink: 0;
      background: #1a2a4a;
      border-bottom: 2px solid #00897B;
      padding: 6px 12px;
      display: flex;
      align-items: center;
      gap: 16px;
      z-index: 100;
    }
    #topbar .logo {
      font-size: 14px;
      font-weight: bold;
      color: #00bfa5;
      white-space: nowrap;
      letter-spacing: 0.5px;
    }
    #topbar .sheet-title {
      font-size: 13px;
      color: #cfd8dc;
    }
    #topbar .spacer { flex: 1; }
    #search-box {
      background: #263750;
      border: 1px solid #455a6a;
      border-radius: 4px;
      color: #e8edf2;
      padding: 4px 10px;
      font-size: 12px;
      width: 130px;
      outline: none;
    }
    #search-box:focus { border-color: #00bfa5; }
    #zoom-controls {
      display: flex;
      gap: 4px;
    }
    #zoom-controls button {
      background: #263750;
      border: 1px solid #455a6a;
      color: #e8edf2;
      border-radius: 4px;
      padding: 3px 9px;
      cursor: pointer;
      font-size: 14px;
    }
    #zoom-controls button:hover { background: #00897B; border-color: #00bfa5; }

    /* ── Sheet nav ── */
    #sheetbar {
      flex-shrink: 0;
      background: #151f2e;
      border-bottom: 1px solid #263750;
      padding: 4px 12px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      z-index: 100;
    }
    #sheetbar a {
      color: #90a4ae;
      text-decoration: none;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 3px;
      border: 1px solid transparent;
      white-space: nowrap;
    }
    #sheetbar a:hover { color: #e8edf2; border-color: #455a6a; }
    #sheetbar a.active {
      color: #fff;
      background: #1a2a4a;
      border-color: #00897B;
    }

    /* ── Map viewport ── */
    #viewport {
      flex: 1;
      overflow: hidden;
      position: relative;
      cursor: grab;
    }
    #viewport.dragging { cursor: grabbing; }

    /* ── Map canvas ── */
    #map-container {
      position: absolute;
      transform-origin: 0 0;
      user-select: none;
    }
    #floor-img {
      display: block;
      width: 7200px;
      height: 5400px;
    }

    /* ── Camera hotspots ── */
    .cam-hotspot {
      position: absolute;
      border: 2px solid transparent;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .cam-hotspot:hover {
      background: rgba(233, 30, 139, 0.20);
      border-color: rgba(233, 30, 139, 0.70);
    }
    .cam-hotspot.highlight {
      background: rgba(233, 30, 139, 0.35);
      border-color: #e91e8b;
      box-shadow: 0 0 0 3px rgba(233,30,139,0.25);
    }

    /* ── Tooltip ── */
    #tooltip {
      position: fixed;
      background: #1a2a4a;
      border: 1px solid #00897B;
      color: #e8edf2;
      padding: 5px 10px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      pointer-events: none;
      display: none;
      z-index: 200;
      white-space: nowrap;
    }

    /* ── Status bar ── */
    #statusbar {
      flex-shrink: 0;
      background: #151f2e;
      border-top: 1px solid #263750;
      padding: 3px 12px;
      font-size: 11px;
      color: #607d8b;
      display: flex;
      gap: 16px;
    }
    #statusbar span { color: #90a4ae; }

    /* ── Jump highlight animation ── */
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(233,30,139,0.7); }
      70%  { box-shadow: 0 0 0 18px rgba(233,30,139,0); }
      100% { box-shadow: 0 0 0 0 rgba(233,30,139,0); }
    }
    .cam-hotspot.jump {
      animation: pulse 0.7s ease 3;
      background: rgba(233, 30, 139, 0.40);
      border-color: #e91e8b;
    }
  </style>
</head>
<body>

<!-- Top bar -->
<div id="topbar">
  <div class="logo">Dynamic Security Technologies</div>
  <div class="sheet-title">T2.10B &nbsp;|&nbsp; Lower Level — North &nbsp;|&nbsp; 19 cameras</div>
  <div class="spacer"></div>
  <input id="search-box" type="text" placeholder="Jump to keynote…" autocomplete="off">
  <div id="zoom-controls">
    <button onclick="zoom(1.25)">+</button>
    <button onclick="zoom(0.8)">−</button>
    <button onclick="resetView()">⌂</button>
  </div>
</div>

<!-- Sheet navigation bar -->
<div id="sheetbar">
  <a href="T2.10B.html" class="active">T2.10B</a>
      <a href="T2.11A.html">T2.11A</a>
      <a href="T2.11B.html">T2.11B</a>
      <a href="T2.12A.html">T2.12A</a>
      <a href="T2.12B.html">T2.12B</a>
      <a href="T2.13A.html">T2.13A</a>
      <a href="T2.13B.html">T2.13B</a>
      <a href="T2.14B.html">T2.14B</a>
</div>

<!-- Map viewport -->
<div id="viewport">
  <div id="map-container">
    <img id="floor-img" src="T2.10B_Annotated_Dynamic_V015.webp" draggable="false" alt="T2.10B floor plan">
    <!-- Camera hotspots injected by JS -->
  </div>
</div>

<!-- Tooltip -->
<div id="tooltip"></div>

<!-- Status bar -->
<div id="statusbar">
  <div>Sheet: <span>T2.10B</span></div>
  <div>Floor: <span>Lower Level — North</span></div>
  <div>Cameras: <span>19</span></div>
  <div id="zoom-pct">Zoom: <span>fit</span></div>
  <div id="hover-info">Hover over a camera to see keynote</div>
</div>

<script>
// ── Camera data ──
const CAMERAS = [
  { id: "K00-01", x: 1244, y: 3641, x0:1198, y0:3602, x1:1290, y1:3680 },
  { id: "K00-02", x: 1634, y: 3795, x0:1588, y0:3756, x1:1680, y1:3834 },
  { id: "K00-03", x: 1968, y: 3274, x0:1922, y0:3235, x1:2014, y1:3313 },
  { id: "K00-04", x: 1117, y: 3270, x0:1071, y0:3231, x1:1163, y1:3309 },
  { id: "K00-05", x: 1631, y: 3032, x0:1585, y0:2993, x1:1677, y1:3071 },
  { id: "K00-06", x: 1190, y: 2729, x0:1144, y0:2690, x1:1236, y1:2768 },
  { id: "K00-07", x: 1871, y: 2240, x0:1825, y0:2201, x1:1917, y1:2279 },
  { id: "K00-08", x: 3501, y: 2291, x0:3455, y0:2252, x1:3547, y1:2330 },
  { id: "K00-09", x: 3464, y: 3706, x0:3418, y0:3667, x1:3510, y1:3745 },
  { id: "K00-10", x: 3984, y: 3748, x0:3938, y0:3709, x1:4030, y1:3787 },
  { id: "K00-11", x: 4152, y: 3913, x0:4106, y0:3874, x1:4198, y1:3952 },
  { id: "K00-12", x: 4510, y: 4032, x0:4464, y0:3993, x1:4556, y1:4071 },
  { id: "K00-13", x: 4596, y: 4386, x0:4550, y0:4347, x1:4642, y1:4425 },
  { id: "K00-14", x: 4893, y: 3700, x0:4847, y0:3661, x1:4939, y1:3739 },
  { id: "K00-15", x: 5150, y: 3650, x0:5104, y0:3611, x1:5196, y1:3689 },
  { id: "K00-16", x: 5147, y: 4232, x0:5101, y0:4193, x1:5193, y1:4271 },
  { id: "K00-17", x: 5391, y: 3998, x0:5345, y0:3959, x1:5437, y1:4037 },
  { id: "K00-18", x: 5686, y: 3807, x0:5640, y0:3768, x1:5732, y1:3846 },
  { id: "K00-19", x: 5373, y: 2268, x0:5327, y0:2229, x1:5419, y1:2307 }
];

const IMG_W = 7200;
const IMG_H = 5400;

// ── State ──
let scale = 1;
let panX = 0, panY = 0;
let isDragging = false;
let dragStartX, dragStartY, panStartX, panStartY;
let activeId = null;

const viewport    = document.getElementById('viewport');
const container   = document.getElementById('map-container');
const tooltip     = document.getElementById('tooltip');
const zoomPct     = document.getElementById('zoom-pct').querySelector('span');
const hoverInfo   = document.getElementById('hover-info');
const searchBox   = document.getElementById('search-box');

// ── Build hotspots ──
CAMERAS.forEach(cam => {
  const div = document.createElement('div');
  div.className = 'cam-hotspot';
  div.id = 'cam-' + cam.id;
  div.style.left  = cam.x0 + 'px';
  div.style.top   = cam.y0 + 'px';
  div.style.width  = (cam.x1 - cam.x0) + 'px';
  div.style.height = (cam.y1 - cam.y0) + 'px';

  div.addEventListener('mouseenter', e => {
    tooltip.textContent = cam.id;
    tooltip.style.display = 'block';
    hoverInfo.textContent = cam.id;
  });
  div.addEventListener('mousemove', e => {
    tooltip.style.left = (e.clientX + 14) + 'px';
    tooltip.style.top  = (e.clientY - 8) + 'px';
  });
  div.addEventListener('mouseleave', () => {
    tooltip.style.display = 'none';
    hoverInfo.textContent = 'Hover over a camera to see keynote';
  });
  div.addEventListener('click', () => jumpTo(cam.id));

  document.getElementById('map-container').appendChild(div);
});

// ── Fit-to-viewport on load ──
function fitView() {
  const vw = viewport.clientWidth;
  const vh = viewport.clientHeight;
  scale = Math.min(vw / IMG_W, vh / IMG_H);
  panX = (vw - IMG_W * scale) / 2;
  panY = (vh - IMG_H * scale) / 2;
  applyTransform();
}

function applyTransform() {
  container.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
  zoomPct.textContent = Math.round(scale * 100) + '%';
}

function zoom(factor) {
  const vw = viewport.clientWidth;
  const vh = viewport.clientHeight;
  const cx = vw / 2;
  const cy = vh / 2;
  // Zoom toward center
  panX = cx - (cx - panX) * factor;
  panY = cy - (cy - panY) * factor;
  scale *= factor;
  applyTransform();
}

function resetView() {
  clearHighlight();
  fitView();
}

// ── Jump to camera ──
function jumpTo(id) {
  const cam = CAMERAS.find(c => c.id === id);
  if (!cam) return;

  clearHighlight();

  // Zoom to ~25% of image width visible
  const vw = viewport.clientWidth;
  const vh = viewport.clientHeight;
  const targetScale = Math.min(vw / (IMG_W * 0.18), vh / (IMG_H * 0.18));
  scale = targetScale;

  // Center the camera in the viewport
  panX = vw / 2 - cam.x * scale;
  panY = vh / 2 - cam.y * scale;
  applyTransform();

  // Pulse highlight
  const el = document.getElementById('cam-' + id);
  if (el) {
    el.classList.add('highlight', 'jump');
    activeId = id;
    el.addEventListener('animationend', () => {
      el.classList.remove('jump');
      el.classList.add('highlight');
    }, { once: true });
  }

  hoverInfo.textContent = 'Jumped to: ' + id;
}

function clearHighlight() {
  if (activeId) {
    const el = document.getElementById('cam-' + activeId);
    if (el) el.classList.remove('highlight', 'jump');
    activeId = null;
  }
}

// ── Pan ──
viewport.addEventListener('mousedown', e => {
  if (e.target.classList.contains('cam-hotspot')) return;
  isDragging = true;
  dragStartX = e.clientX; dragStartY = e.clientY;
  panStartX = panX; panStartY = panY;
  viewport.classList.add('dragging');
});
window.addEventListener('mousemove', e => {
  if (!isDragging) return;
  panX = panStartX + (e.clientX - dragStartX);
  panY = panStartY + (e.clientY - dragStartY);
  applyTransform();
});
window.addEventListener('mouseup', () => {
  isDragging = false;
  viewport.classList.remove('dragging');
});

// ── Scroll-to-zoom ──
viewport.addEventListener('wheel', e => {
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.12 : 0.89;
  const rect = viewport.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  panX = mx - (mx - panX) * factor;
  panY = my - (my - panY) * factor;
  scale *= factor;
  applyTransform();
}, { passive: false });

// ── Touch pan/pinch ──
let lastTouches = [];
viewport.addEventListener('touchstart', e => {
  lastTouches = Array.from(e.touches).map(t => ({x:t.clientX,y:t.clientY}));
}, {passive:true});
viewport.addEventListener('touchmove', e => {
  e.preventDefault();
  const touches = Array.from(e.touches).map(t => ({x:t.clientX,y:t.clientY}));
  if (touches.length === 1 && lastTouches.length === 1) {
    panX += touches[0].x - lastTouches[0].x;
    panY += touches[0].y - lastTouches[0].y;
    applyTransform();
  } else if (touches.length === 2 && lastTouches.length === 2) {
    const d0 = Math.hypot(lastTouches[1].x-lastTouches[0].x, lastTouches[1].y-lastTouches[0].y);
    const d1 = Math.hypot(touches[1].x-touches[0].x, touches[1].y-touches[0].y);
    const factor = d1 / d0;
    const cx = (touches[0].x + touches[1].x) / 2;
    const cy = (touches[0].y + touches[1].y) / 2;
    panX = cx - (cx - panX) * factor;
    panY = cy - (cy - panY) * factor;
    scale *= factor;
    applyTransform();
  }
  lastTouches = touches;
}, {passive:false});

// ── Search / jump box ──
searchBox.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const val = searchBox.value.trim().toUpperCase();
    const match = CAMERAS.find(c => c.id === val);
    if (match) {
      jumpTo(match.id);
      searchBox.value = '';
    } else {
      searchBox.style.borderColor = '#e53935';
      setTimeout(() => searchBox.style.borderColor = '', 800);
    }
  }
});

// ── URL hash jump on load ──
window.addEventListener('load', () => {
  fitView();
  const hash = window.location.hash.replace('#','').toUpperCase();
  if (hash) {
    // Small delay to let image render
    setTimeout(() => jumpTo(hash), 300);
  }
});

// Refit on window resize
window.addEventListener('resize', fitView);
</script>
</body>
</html>
