<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>St. Ignatius — T2.13B Camera Locator V0.12</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Arial,sans-serif;background:#1a1a2e;color:#eee;overflow:hidden}
  #header{position:fixed;top:0;left:0;right:0;height:56px;background:#0d0d1a;
    display:flex;align-items:center;padding:0 16px;gap:12px;z-index:100;
    border-bottom:2px solid #e91e8c}
  .logo{color:#e91e8c;font-size:20px;font-weight:900;letter-spacing:1px}
  .sheet{color:#fff;font-weight:bold;font-size:14px}
  .title{color:#ccc;font-size:12px}
  #bar{position:fixed;top:56px;left:0;right:0;height:36px;background:#12122a;
    display:flex;align-items:center;padding:0 16px;font-size:13px;
    border-bottom:1px solid #333;z-index:99}
  #bar span{color:#e91e8c;font-weight:bold;margin-right:8px}
  #wrap{position:fixed;top:92px;left:220px;right:0;bottom:0;overflow:auto;cursor:grab}
  #wrap.grab{cursor:grabbing}
  canvas{display:block}
  #zbtn{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:6px;z-index:100}
  #zbtn button{width:40px;height:40px;border-radius:8px;border:none;background:#e91e8c;
    color:#fff;font-size:22px;font-weight:bold;cursor:pointer}
  #zbtn button:hover{background:#c0176e}
  #list{position:fixed;top:92px;left:0;bottom:0;width:220px;background:#0d0d1a;
    overflow-y:auto;border-right:1px solid #333;z-index:98}
  .item{padding:8px 14px;cursor:pointer;border-bottom:1px solid #1e1e3a;font-size:12px}
  .item:hover{background:#1e1e3a}
  .item.active{background:#e91e8c22;border-left:3px solid #e91e8c}
  .kn{color:#e91e8c;font-weight:bold}
  .src{color:#888;font-size:10px}
  #tog{position:fixed;top:92px;left:220px;width:28px;height:60px;background:#1e1e3a;
    border:1px solid #333;border-left:none;cursor:pointer;z-index:99;
    display:flex;align-items:center;justify-content:center;font-size:16px;color:#ccc}
  body.hidden #list{display:none}
  body.hidden #tog{left:0}
  body.hidden #wrap{left:0}
  #loading{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
    color:#e91e8c;font-size:16px;font-weight:bold;z-index:200;text-align:center}
</style>
</head>
<body>
<div id="header">
  <div class="logo">DYNAMIC</div>
  <div>
    <div class="sheet">T2.13B — Level 3 (North)</div>
    <div class="title">St. Ignatius College Preparatory | Camera Locator V0.12 | Rev 3 IFC 04/10/2026</div>
  </div>
</div>
<div id="bar"><span id="cn">—</span><span id="cs"></span></div>
<div id="tog" onclick="toggleList()">☰</div>
<div id="list"></div>
<div id="wrap"><canvas id="cv"></canvas></div>
<div id="loading">Loading floor plan…</div>
<div id="zbtn">
  <button onclick="zoom(1.3)">+</button>
  <button onclick="zoom(0.77)">−</button>
  <button onclick="resetView()" style="font-size:13px">↺</button>
</div>
<script>
const IMG_W=10368, IMG_H=7776;
const CAMS={
  "K03-07": {
    "x": 1479,
    "y": 4248,
    "source": "r3"
  },
  "K03-08": {
    "x": 3498,
    "y": 3438,
    "source": "r3"
  },
  "K03-09": {
    "x": 5568,
    "y": 4656,
    "source": "r3"
  },
  "K03-15": {
    "x": 7713,
    "y": 6012,
    "source": "r3"
  },
  "K03-16": {
    "x": 7170,
    "y": 6150,
    "source": "r3"
  },
  "K03-17": {
    "x": 6897,
    "y": 5754,
    "source": "r3"
  },
  "K03-20": {
    "x": 3171,
    "y": 4590,
    "source": "r3"
  },
  "K03-23": {
    "x": 1977,
    "y": 5412,
    "source": "r3"
  },
  "K03-10": {
    "x": 7551,
    "y": 4188,
    "source": "rcp"
  },
  "K03-11": {
    "x": 8163,
    "y": 3069,
    "source": "rcp"
  },
  "K03-12": {
    "x": 7968,
    "y": 3909,
    "source": "rcp"
  },
  "K03-13": {
    "x": 7995,
    "y": 5763,
    "source": "rcp"
  },
  "K03-14": {
    "x": 8643,
    "y": 6207,
    "source": "rcp"
  },
  "K03-18": {
    "x": 5355,
    "y": 5769,
    "source": "rcp"
  },
  "K03-19": {
    "x": 3648,
    "y": 5772,
    "source": "rcp"
  },
  "K03-21": {
    "x": 2550,
    "y": 5343,
    "source": "rcp"
  },
  "K03-22": {
    "x": 1782,
    "y": 5112,
    "source": "rcp"
  },
  "K03-24": {
    "x": 6516,
    "y": 3066,
    "source": "sca"
  }
};
const IDS=Object.keys(CAMS);
const cv=document.getElementById('cv');
const ctx=cv.getContext('2d');
const wrap=document.getElementById('wrap');
const listEl=document.getElementById('list');
const cnEl=document.getElementById('cn');
const csEl=document.getElementById('cs');
const loadEl=document.getElementById('loading');

const targetCam=new URLSearchParams(window.location.search).get('cam');
// Zoom in close if a specific camera was requested, otherwise fit width
let scale = targetCam && CAMS[targetCam] ? 0.45 : Math.min(0.13,(window.innerWidth-220)/IMG_W);
let activeCam=null, imgLoaded=false;

// Build list
IDS.forEach(kn=>{
  const d=document.createElement('div');
  d.className='item'; d.id='li-'+kn;
  const src=CAMS[kn].source==='rcp'?'RCP inferred':CAMS[kn].source==='sca'?'SCA Rev3':'Rev3';
  d.innerHTML='<div class="kn">'+kn+'</div><div class="src">'+src+'</div>';
  d.onclick=()=>selectCam(kn);
  listEl.appendChild(d);
});

// Load image then navigate
const img=new Image();
img.onload=()=>{
  imgLoaded=true;
  loadEl.style.display='none';
  if(targetCam && CAMS[targetCam]){
    activeCam=targetCam;
    draw(targetCam);
    // Scroll to camera after paint
    requestAnimationFrame(()=>{
      const cam=CAMS[targetCam];
      wrap.scrollLeft=Math.max(0, cam.x*scale - wrap.clientWidth/2);
      wrap.scrollTop =Math.max(0, cam.y*scale - wrap.clientHeight/2);
      cnEl.textContent=targetCam;
      const sl=cam.source==='rcp'?' — assumed from RCP':cam.source==='sca'?' — SCA Rev3':' — Rev3 keynoted';
      csEl.textContent=sl;
      const li=document.getElementById('li-'+targetCam);
      if(li){li.classList.add('active');li.scrollIntoView({block:'nearest'});}
    });
  } else {
    draw();
  }
};
img.onerror=()=>{loadEl.textContent='Image failed to load.'};
img.src='img_T2.13B.webp';

function draw(hl=null){
  const w=Math.round(IMG_W*scale), h=Math.round(IMG_H*scale);
  cv.width=w; cv.height=h;
  if(imgLoaded) ctx.drawImage(img,0,0,w,h);
  IDS.forEach(kn=>{
    const cam=CAMS[kn];
    const x=cam.x*scale, y=cam.y*scale;
    const r=Math.max(10,16*scale);
    const active=kn===hl;
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fillStyle=active?'#e91e8c':'rgba(233,30,140,0.45)';
    ctx.fill();
    ctx.strokeStyle=active?'#fff':'#e91e8c';
    ctx.lineWidth=active?3:1.5; ctx.stroke();
    // Always show label when zoomed or active
    if(active || scale>0.15){
      // Label background
      const lbl=kn;
      ctx.font=`bold ${Math.max(10,Math.round(12*scale))}px Arial`;
      const tw=ctx.measureText(lbl).width;
      const ly=y-r-Math.max(8,10*scale);
      ctx.fillStyle='rgba(13,13,26,0.75)';
      ctx.fillRect(x-tw/2-3,ly-13,tw+6,16);
      ctx.fillStyle=active?'#fff':'#e91e8c';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(lbl,x,ly-5);
    }
  });
}

function selectCam(kn){
  activeCam=kn;
  const cam=CAMS[kn];
  cnEl.textContent=kn;
  const sl=cam.source==='rcp'?' — assumed from RCP':cam.source==='sca'?' — SCA Rev3':' — Rev3 keynoted';
  csEl.textContent=sl;
  document.querySelectorAll('.item').forEach(e=>e.classList.remove('active'));
  const li=document.getElementById('li-'+kn);
  if(li){li.classList.add('active');li.scrollIntoView({block:'nearest'});}
  draw(kn);
  requestAnimationFrame(()=>{
    wrap.scrollLeft=Math.max(0,cam.x*scale-wrap.clientWidth/2);
    wrap.scrollTop =Math.max(0,cam.y*scale-wrap.clientHeight/2);
  });
}

function zoom(f){
  scale=Math.min(2.0,Math.max(0.05,scale*f));
  draw(activeCam);
  if(activeCam){
    const cam=CAMS[activeCam];
    requestAnimationFrame(()=>{
      wrap.scrollLeft=Math.max(0,cam.x*scale-wrap.clientWidth/2);
      wrap.scrollTop =Math.max(0,cam.y*scale-wrap.clientHeight/2);
    });
  }
}

function resetView(){
  scale=Math.min(0.13,(window.innerWidth-220)/IMG_W);
  activeCam=null; cnEl.textContent='—'; csEl.textContent='';
  document.querySelectorAll('.item').forEach(e=>e.classList.remove('active'));
  draw(); wrap.scrollLeft=0; wrap.scrollTop=0;
}

function toggleList(){document.body.classList.toggle('hidden');draw(activeCam);}

let drag=false,dx=0,dy=0;
wrap.addEventListener('mousedown',e=>{drag=true;dx=e.clientX+wrap.scrollLeft;dy=e.clientY+wrap.scrollTop;wrap.classList.add('grab')});
window.addEventListener('mousemove',e=>{if(drag){wrap.scrollLeft=dx-e.clientX;wrap.scrollTop=dy-e.clientY}});
window.addEventListener('mouseup',()=>{drag=false;wrap.classList.remove('grab')});
wrap.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.1:0.91)},{passive:false});
</script>
</body>
</html>
