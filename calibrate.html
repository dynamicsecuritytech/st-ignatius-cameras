<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Camera Calibration Tool</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #1a1a2e; color: #eee; font-family: Arial, sans-serif; height: 100vh; display: flex; flex-direction: column; }
#toolbar { background: #16213e; padding: 8px 12px; display: flex; align-items: center; gap: 10px; border-bottom: 2px solid #0f3460; flex-shrink: 0; flex-wrap: wrap; }
#toolbar h1 { font-size: 13px; color: #e94560; }
#sheet-select { background: #0f3460; color: #eee; border: 1px solid #e94560; padding: 4px 8px; border-radius: 4px; font-size: 13px; }
#cam-select { background: #0f3460; color: #eee; border: 1px solid #4fc3f7; padding: 4px 8px; border-radius: 4px; font-size: 13px; min-width: 110px; }
#status-bar { background: #0f3460; padding: 4px 10px; border-radius: 4px; font-size: 12px; color: #4fc3f7; flex: 1; }
#progress { font-size: 12px; color: #aaa; }
button { background: #0f3460; border: 1px solid #e94560; color: #eee; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
button:hover { background: #e94560; }
button.green { border-color: #4caf50; }
button.green:hover { background: #4caf50; }
#canvas-wrap { flex: 1; overflow: hidden; position: relative; cursor: crosshair; }
canvas { position: absolute; top: 0; left: 0; }
#overlay { position: absolute; top: 0; left: 0; pointer-events: none; }
#export-box { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85); z-index: 100; display: none; align-items: center; justify-content: center; }
#export-box.show { display: flex; }
#export-inner { background: #16213e; border: 2px solid #e94560; border-radius: 8px; padding: 20px; max-width: 700px; width: 90%; }
#export-inner h2 { color: #e94560; margin-bottom: 10px; font-size: 14px; }
textarea { width: 100%; height: 300px; background: #0a0a1a; color: #4fc3f7; border: 1px solid #0f3460; padding: 8px; font-family: monospace; font-size: 11px; border-radius: 4px; }
.dot { position: absolute; width: 12px; height: 12px; border-radius: 50%; transform: translate(-50%,-50%); pointer-events: none; }
.dot.confirmed { background: #4caf50; border: 2px solid #fff; }
.dot.pending { background: #e94560; border: 2px solid #fff; opacity: 0.6; }
</style>
</head>
<body>
<div id="toolbar">
  <h1>📍 CALIBRATION</h1>
  <select id="sheet-select"></select>
  <select id="cam-select"></select>
  <div id="status-bar">Click the camera icon on the plan to set its position</div>
  <div id="progress"></div>
  <button onclick="skipCam()">Skip →</button>
  <button class="green" onclick="showExport()">Export JSON</button>
  <button onclick="zoomBy(1.5)">＋</button>
  <button onclick="zoomBy(0.67)">－</button>
  <button onclick="fitView()">Fit</button>
</div>
<div id="canvas-wrap">
  <canvas id="plan"></canvas>
  <svg id="overlay" style="width:100%;height:100%;position:absolute;top:0;left:0;pointer-events:none;"></svg>
</div>
<div id="export-box">
  <div id="export-inner">
    <h2>Calibrated Coordinates JSON — paste into camera_index.json</h2>
    <textarea id="export-text"></textarea>
    <div style="margin-top:10px;display:flex;gap:10px;">
      <button onclick="copyExport()">Copy</button>
      <button onclick="document.getElementById('export-box').classList.remove('show')">Close</button>
    </div>
  </div>
</div>

const BASE = "https://dynamicsecuritytech.github.io/st-ignatius-cameras/";

// calibrated[cam_id] = {x, y}  (pixel coords at 3× scale)
const calibrated = {};

// Group cameras by sheet
const bySheet = {};
for (const [cam, info] of Object.entries(CAMERA_INDEX)) {
  if (!bySheet[info.sheet]) bySheet[info.sheet] = [];
  bySheet[info.sheet].push(cam);
}
for (const s of Object.keys(bySheet)) bySheet[s].sort();

// ── UI setup ─────────────────────────────────────────────────────────────────
const sheetSelect = document.getElementById('sheet-select');
const camSelect   = document.getElementById('cam-select');
const statusBar   = document.getElementById('status-bar');
const progress    = document.getElementById('progress');

for (const sheet of Object.keys(bySheet).sort()) {
  const o = document.createElement('option');
  o.value = o.textContent = sheet;
  sheetSelect.appendChild(o);
}

sheetSelect.addEventListener('change', () => loadSheet(sheetSelect.value));
camSelect.addEventListener('change', () => highlightCurrent());

function populateCams(sheet) {
  camSelect.innerHTML = '';
  for (const cam of bySheet[sheet] || []) {
    const o = document.createElement('option');
    o.value = o.textContent = cam;
    if (calibrated[cam]) o.style.color = '#4caf50';
    camSelect.appendChild(o);
  }
  updateProgress();
}

// ── Canvas / pan-zoom ─────────────────────────────────────────────────────────
const canvas = document.getElementById('plan');
const ctx    = canvas.getContext('2d');
const wrap   = document.getElementById('canvas-wrap');
const svg    = document.getElementById('overlay');

let scale = 1, offX = 0, offY = 0;
let dragging = false, moved = false, lastX = 0, lastY = 0;
let imgW = 0, imgH = 0;
let currentSheet = null;
let img = new Image();

img.onload = () => {
  imgW = img.naturalWidth; imgH = img.naturalHeight;
  canvas.width = imgW; canvas.height = imgH;
  ctx.drawImage(img, 0, 0);
  fitView();
  drawDots();
};

function loadSheet(sheet) {
  currentSheet = sheet;
  img.src = BASE + sheet + '.png';
  populateCams(sheet);
  highlightCurrent();
}

function fitView() {
  const ww = wrap.clientWidth, wh = wrap.clientHeight;
  scale = Math.min(ww / imgW, wh / imgH) * 0.95;
  offX = (ww - imgW * scale) / 2;
  offY = (wh - imgH * scale) / 2;
  applyTransform();
}

function applyTransform() {
  canvas.style.transform = `translate(${offX}px,${offY}px) scale(${scale})`;
  canvas.style.transformOrigin = '0 0';
  drawDots();
}

function zoomBy(f, cx, cy) {
  if (cx === undefined) { cx = wrap.clientWidth/2; cy = wrap.clientHeight/2; }
  const ns = Math.min(Math.max(scale*f, 0.05), 20);
  offX = cx - (cx-offX)*(ns/scale);
  offY = cy - (cy-offY)*(ns/scale);
  scale = ns;
  applyTransform();
}

wrap.addEventListener('wheel', e => {
  e.preventDefault();
  const r = wrap.getBoundingClientRect();
  zoomBy(e.deltaY<0?1.15:0.87, e.clientX-r.left, e.clientY-r.top);
}, {passive:false});

wrap.addEventListener('mousedown', e => {
  dragging = true; moved = false;
  lastX = e.clientX; lastY = e.clientY;
});
window.addEventListener('mousemove', e => {
  if (!dragging) return;
  const dx = e.clientX-lastX, dy = e.clientY-lastY;
  if (Math.abs(dx)+Math.abs(dy) > 3) moved = true;
  offX += dx; offY += dy;
  lastX = e.clientX; lastY = e.clientY;
  applyTransform();
});
window.addEventListener('mouseup', e => {
  if (dragging && !moved) handleClick(e);
  dragging = false;
});

function handleClick(e) {
  const r = wrap.getBoundingClientRect();
  const imgX = Math.round((e.clientX - r.left - offX) / scale);
  const imgY = Math.round((e.clientY - r.top  - offY) / scale);
  const cam = camSelect.value;
  if (!cam) return;
  calibrated[cam] = {x: imgX, y: imgY};
  // colour the option green
  for (const o of camSelect.options) {
    if (o.value === cam) o.style.color = '#4caf50';
  }
  statusBar.textContent = `✓ ${cam} → (${imgX}, ${imgY})`;
  updateProgress();
  drawDots();
  // Auto-advance to next cam
  const idx = camSelect.selectedIndex;
  if (idx < camSelect.options.length-1) {
    camSelect.selectedIndex = idx+1;
    highlightCurrent();
  }
}

function skipCam() {
  const idx = camSelect.selectedIndex;
  if (idx < camSelect.options.length-1) {
    camSelect.selectedIndex = idx+1;
    highlightCurrent();
  }
}

function highlightCurrent() {
  const cam = camSelect.value;
  if (!cam) return;
  const info = CAMERA_INDEX[cam];
  statusBar.textContent = calibrated[cam]
    ? `${cam} already set at (${calibrated[cam].x},${calibrated[cam].y}) — click to re-set`
    : `Click the camera icon for ${cam}`;
  // Show existing coord as hint
  drawDots();
}

// ── Dot overlay ───────────────────────────────────────────────────────────────
function drawDots() {
  if (!currentSheet) return;
  svg.innerHTML = '';
  const cams = bySheet[currentSheet] || [];
  for (const cam of cams) {
    const coord = calibrated[cam] || CAMERA_INDEX[cam];
    if (!coord) continue;
    const sx = coord.x * scale + offX;
    const sy = coord.y * scale + offY;
    const isCalibrated = !!calibrated[cam];
    const isCurrent = cam === camSelect.value;

    const circle = document.createElementNS('http://www.w3.org/2000/svg','circle');
    circle.setAttribute('cx', sx);
    circle.setAttribute('cy', sy);
    circle.setAttribute('r', isCurrent ? 18 : 8);
    circle.setAttribute('fill', isCalibrated ? 'rgba(76,175,80,0.4)' : 'rgba(233,69,96,0.3)');
    circle.setAttribute('stroke', isCalibrated ? '#4caf50' : (isCurrent ? '#e94560' : '#ff9800'));
    circle.setAttribute('stroke-width', isCurrent ? 3 : 1.5);
    svg.appendChild(circle);

    if (isCurrent || isCalibrated) {
      const text = document.createElementNS('http://www.w3.org/2000/svg','text');
      text.setAttribute('x', sx);
      text.setAttribute('y', sy - 12);
      text.setAttribute('text-anchor','middle');
      text.setAttribute('fill', isCalibrated ? '#4caf50' : '#e94560');
      text.setAttribute('font-size', '11');
      text.setAttribute('font-weight', 'bold');
      text.setAttribute('font-family', 'Arial');
      text.textContent = cam;
      svg.appendChild(text);
    }
  }
}

function updateProgress() {
  const sheet = currentSheet;
  if (!sheet) return;
  const cams = bySheet[sheet] || [];
  const done = cams.filter(c => calibrated[c]).length;
  const total = Object.keys(CAMERA_INDEX).length;
  const totalDone = Object.keys(calibrated).length;
  progress.textContent = `Sheet: ${done}/${cams.length} | Total: ${totalDone}/${total}`;
}

// ── Export ────────────────────────────────────────────────────────────────────
function showExport() {
  // Merge calibrated into original index
  const merged = JSON.parse(JSON.stringify(CAMERA_INDEX));
  for (const [cam, coord] of Object.entries(calibrated)) {
    merged[cam].x = coord.x;
    merged[cam].y = coord.y;
    delete merged[cam].fallback;
  }
  document.getElementById('export-text').value = JSON.stringify(merged, null, 2);
  document.getElementById('export-box').classList.add('show');
}

function copyExport() {
  const ta = document.getElementById('export-text');
  ta.select();
  document.execCommand('copy');
  statusBar.textContent = '✓ Copied to clipboard!';
}

// ── Init ──────────────────────────────────────────────────────────────────────
loadSheet(sheetSelect.options[0]?.value);
</script>
</body>
</html>
