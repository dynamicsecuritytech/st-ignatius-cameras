<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>St. Ignatius — Level 2 South — T2.12A</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #1a1a2e; font-family: Arial, sans-serif; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
  
  #header {
    background: #16213e;
    color: #e0e0e0;
    padding: 8px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
    border-bottom: 2px solid #0f3460;
    flex-wrap: wrap;
  }
  #header h1 { font-size: 13px; font-weight: bold; color: #ffffff; white-space: nowrap; }
  #header .subtitle { font-size: 11px; color: #888; }
  
  #cam-bar {
    background: #0f3460;
    padding: 6px 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    flex-shrink: 0;
    overflow-y: auto;
    max-height: 80px;
    border-bottom: 1px solid #1a1a4e;
  }
  .cam-btn {
    background: #1e4080;
    color: #c0d8ff;
    border: 1px solid #2a5aaa;
    border-radius: 3px;
    padding: 3px 8px;
    font-size: 11px;
    font-family: Arial, sans-serif;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s;
  }
  .cam-btn:hover { background: #e94560; color: #fff; border-color: #e94560; }
  .cam-btn.active { background: #e94560; color: #fff; border-color: #c73050; }
  
  #viewport {
    flex: 1;
    overflow: hidden;
    position: relative;
    cursor: grab;
    background: #111;
  }
  #viewport.grabbing { cursor: grabbing; }
  
  #canvas-wrap {
    position: absolute;
    transform-origin: 0 0;
  }
  
  #floorplan {
    display: block;
    width: 13824px;
    height: 10368px;
  }
  
  .cam-marker {
    position: absolute;
    width: 40px;
    height: 40px;
    transform: translate(-50%, -50%);
    cursor: pointer;
    pointer-events: all;
    z-index: 10;
  }
  .cam-marker circle.ring {
    fill: none;
    stroke: #ff3366;
    stroke-width: 3;
    opacity: 0;
    r: 18;
    cx: 20; cy: 20;
    transition: opacity 0.2s;
  }
  .cam-marker.highlight circle.ring { opacity: 1; animation: pulse 1.2s ease-out 3; }
  @keyframes pulse {
    0%   { r: 14; opacity: 1; stroke-width: 4; }
    100% { r: 28; opacity: 0; stroke-width: 1; }
  }
  
  #tooltip {
    position: fixed;
    background: rgba(15,52,96,0.95);
    color: #fff;
    padding: 5px 10px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: bold;
    pointer-events: none;
    display: none;
    z-index: 100;
    border: 1px solid #2a5aaa;
  }
  
  #controls {
    position: absolute;
    bottom: 12px;
    right: 12px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    z-index: 20;
  }
  .ctrl-btn {
    width: 34px; height: 34px;
    background: rgba(15,52,96,0.9);
    color: #fff;
    border: 1px solid #2a5aaa;
    border-radius: 4px;
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
  }
  .ctrl-btn:hover { background: #e94560; }
  
  #zoom-label {
    position: absolute;
    bottom: 12px;
    left: 12px;
    background: rgba(15,52,96,0.8);
    color: #aaa;
    font-size: 11px;
    padding: 4px 8px;
    border-radius: 3px;
    z-index: 20;
  }
</style>
</head>
<body>

<div id="header">
  <div>
    <div id="header" style="display:inline;background:none;border:none;padding:0;">
      <h1 style="display:inline;">St. Ignatius College Preparatory &nbsp;|&nbsp; Level 2 South — T2.12A</h1>
      <span class="subtitle">&nbsp;— Security Camera Locator &nbsp;|&nbsp; Dynamic Security Technology &nbsp;|&nbsp; Rev 3 IFC 04/10/2026</span>
    </div>
  </div>
</div>

<div id="cam-bar" id="cam-bar">
</div>

<div id="viewport" id="viewport">
  <div id="canvas-wrap" id="canvas-wrap">
    <img id="floorplan" src="img_T2.12A.png" alt="Level 2 South — T2.12A" draggable="false">
  </div>
  <div id="controls">
    <button class="ctrl-btn" onclick="zoom(1.25)" title="Zoom In">+</button>
    <button class="ctrl-btn" onclick="zoom(0.8)" title="Zoom Out">−</button>
    <button class="ctrl-btn" onclick="resetView()" title="Reset View" style="font-size:13px;">⌂</button>
  </div>
  <div id="zoom-label">Scroll to zoom &nbsp;|&nbsp; Drag to pan</div>
</div>
<div id="tooltip"></div>

<script>
const IMG_W = 13824;
const IMG_H = 10368;
const CAMERAS = [
    {id:"K02-01",px:7994,py:7455},
    {id:"K02-02",px:7285,py:6621},
    {id:"K02-03",px:6947,py:5106},
    {id:"K02-04",px:8548,py:5312},
    {id:"K02-05",px:7231,py:3986}
  ];

// State
let scale = 0.1;
let ox = 0, oy = 0;
let dragging = false, lastX = 0, lastY = 0;
let activeBtn = null, activeMarker = null;

const viewport = document.getElementById('viewport');
const wrap = document.getElementById('canvas-wrap');
const tooltip = document.getElementById('tooltip');
const camBar = document.getElementById('cam-bar');

// Build camera buttons
CAMERAS.forEach(cam => {
  const btn = document.createElement('button');
  btn.className = 'cam-btn';
  btn.textContent = cam.id;
  btn.title = cam.id;
  btn.onclick = () => goToCamera(cam, btn);
  camBar.appendChild(btn);
});

// Build SVG markers overlaid on image
CAMERAS.forEach(cam => {
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('class','cam-marker');
  svg.setAttribute('data-id', cam.id);
  svg.setAttribute('viewBox','0 0 40 40');
  svg.style.left = cam.px + 'px';
  svg.style.top  = cam.py + 'px';
  svg.innerHTML = `<circle class="ring" cx="20" cy="20" r="18"/>`;
  svg.addEventListener('mouseenter', e => showTip(e, cam.id));
  svg.addEventListener('mouseleave', hideTip);
  svg.addEventListener('click', () => goToCamera(cam, camBar.querySelector('[title="'+cam.id+'"]')));
  wrap.appendChild(svg);
});

function applyTransform() {
  wrap.style.transform = `translate(${ox}px,${oy}px) scale(${scale})`;
  document.getElementById('zoom-label').textContent =
    `Zoom ${Math.round(scale*100)}%  |  Scroll to zoom  |  Drag to pan`;
}

function initialFit() {
  const vw = viewport.clientWidth, vh = viewport.clientHeight;
  scale = Math.min(vw/IMG_W, vh/IMG_H) * 0.95;
  ox = (vw - IMG_W*scale)/2;
  oy = (vh - IMG_H*scale)/2;
  applyTransform();
}

function resetView() {
  if (activeBtn) { activeBtn.classList.remove('active'); activeBtn = null; }
  if (activeMarker) { activeMarker.classList.remove('highlight'); activeMarker = null; }
  initialFit();
}

function zoom(factor, cx, cy) {
  const vw = viewport.clientWidth, vh = viewport.clientHeight;
  const pivotX = (cx !== undefined ? cx : vw/2);
  const pivotY = (cy !== undefined ? cy : vh/2);
  const newScale = Math.min(Math.max(scale * factor, 0.05), 4);
  const ratio = newScale/scale;
  ox = pivotX - ratio*(pivotX - ox);
  oy = pivotY - ratio*(pivotY - oy);
  scale = newScale;
  applyTransform();
}

function goToCamera(cam, btn) {
  // Highlight button
  if (activeBtn) activeBtn.classList.remove('active');
  activeBtn = btn;
  if (btn) btn.classList.add('active');
  
  // Highlight marker
  if (activeMarker) activeMarker.classList.remove('highlight');
  activeMarker = wrap.querySelector(`[data-id="${cam.id}"]`);
  if (activeMarker) {
    activeMarker.classList.remove('highlight');
    void activeMarker.offsetWidth; // force reflow to restart animation
    activeMarker.classList.add('highlight');
  }
  
  // Zoom to 25% of full image width = good detail view
  const vw = viewport.clientWidth, vh = viewport.clientHeight;
  const targetScale = Math.min(vw / (IMG_W * 0.25), vh / (IMG_H * 0.25));
  scale = Math.min(targetScale, 2.5);
  
  // Center the camera in viewport
  ox = vw/2 - cam.px * scale;
  oy = vh/2 - cam.py * scale;
  applyTransform();
  
  // Scroll button into view
  if (btn) btn.scrollIntoView({block:'nearest', inline:'center'});
}

// Pan
viewport.addEventListener('mousedown', e => {
  if (e.target.closest('.cam-marker') || e.target.closest('.ctrl-btn')) return;
  dragging = true; lastX = e.clientX; lastY = e.clientY;
  viewport.classList.add('grabbing');
});
window.addEventListener('mousemove', e => {
  if (!dragging) return;
  ox += e.clientX - lastX; oy += e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  applyTransform();
});
window.addEventListener('mouseup', () => { dragging = false; viewport.classList.remove('grabbing'); });

// Touch pan
viewport.addEventListener('touchstart', e => {
  if (e.touches.length === 1) { lastX = e.touches[0].clientX; lastY = e.touches[0].clientY; dragging = true; }
}, {passive:true});
viewport.addEventListener('touchmove', e => {
  if (!dragging || e.touches.length !== 1) return;
  ox += e.touches[0].clientX - lastX; oy += e.touches[0].clientY - lastY;
  lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
  applyTransform();
}, {passive:true});
viewport.addEventListener('touchend', () => dragging = false);

// Scroll zoom
viewport.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = viewport.getBoundingClientRect();
  zoom(e.deltaY < 0 ? 1.12 : 0.9, e.clientX - rect.left, e.clientY - rect.top);
}, {passive:false});

// Tooltip
function showTip(e, id) {
  tooltip.textContent = id;
  tooltip.style.display = 'block';
  moveTip(e);
}
function hideTip() { tooltip.style.display = 'none'; }
viewport.addEventListener('mousemove', e => { if (tooltip.style.display !== 'none') moveTip(e); });
function moveTip(e) {
  tooltip.style.left = (e.clientX + 14) + 'px';
  tooltip.style.top  = (e.clientY - 28) + 'px';
}

// URL param: ?cam=K01-01
function checkUrlCam() {
  const params = new URLSearchParams(location.search);
  const camId = params.get('cam');
  if (camId) {
    const cam = CAMERAS.find(c => c.id === camId);
    if (cam) {
      const btn = camBar.querySelector(`[title="${camId}"]`);
      goToCamera(cam, btn);
    }
  }
}

window.addEventListener('load', () => {
  initialFit();
  checkUrlCam();
});
window.addEventListener('resize', initialFit);
</script>
</body>
</html>
