<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>St. Ignatius — T2.12A Camera Locator V0.12</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #1a1a2e; color: #eee; overflow: hidden; }
  #header { position: fixed; top: 0; left: 0; right: 0; height: 56px; background: #0d0d1a;
             display: flex; align-items: center; padding: 0 16px; gap: 12px; z-index: 100;
             border-bottom: 2px solid #e91e8c; }
  #header .logo { color: #e91e8c; font-size: 20px; font-weight: 900; letter-spacing: 1px; }
  #header .sheet { color: #fff; font-weight: bold; font-size: 14px; }
  #header .title { color: #ccc; font-size: 13px; }
  #cam-label { position: fixed; top: 56px; left: 0; right: 0; height: 36px; background: #12122a;
                display: flex; align-items: center; padding: 0 16px; font-size: 13px;
                border-bottom: 1px solid #333; z-index: 99; }
  #cam-label span { color: #e91e8c; font-weight: bold; margin-right: 8px; }
  #canvas-wrap { position: fixed; top: 92px; left: 220px; right: 0; bottom: 0; overflow: auto; cursor: grab; }
  #canvas-wrap.grabbing { cursor: grabbing; }
  canvas { display: block; }
  #zoom-btns { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column;
                gap: 6px; z-index: 100; }
  #zoom-btns button { width: 40px; height: 40px; border-radius: 8px; border: none;
                        background: #e91e8c; color: #fff; font-size: 22px; font-weight: bold;
                        cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.5); }
  #zoom-btns button:hover { background: #c0176e; }
  #cam-list { position: fixed; top: 92px; left: 0; bottom: 0; width: 220px; background: #0d0d1a;
               overflow-y: auto; border-right: 1px solid #333; z-index: 98; }
  #cam-list .item { padding: 8px 14px; cursor: pointer; border-bottom: 1px solid #1e1e3a;
                     font-size: 12px; transition: background 0.15s; }
  #cam-list .item:hover { background: #1e1e3a; }
  #cam-list .item.active { background: #e91e8c22; border-left: 3px solid #e91e8c; }
  #cam-list .item .kn { color: #e91e8c; font-weight: bold; }
  #cam-list .item .src { color: #888; font-size: 10px; }
  #toggle-list { position: fixed; top: 92px; left: 220px; width: 28px; height: 60px;
                  background: #1e1e3a; border: 1px solid #333; border-left: none;
                  cursor: pointer; z-index: 99; display: flex; align-items: center;
                  justify-content: center; font-size: 16px; color: #ccc; }
  body.list-hidden #cam-list { display: none; }
  body.list-hidden #toggle-list { left: 0; }
  body.list-hidden #canvas-wrap { left: 0; }
  #loading { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
              color: #e91e8c; font-size: 18px; font-weight: bold; z-index: 200; }
</style>
</head>
<body>
<div id="header">
  <div class="logo">DYNAMIC</div>
  <div>
    <div class="sheet">T2.12A — Level 2 (South)</div>
    <div class="title">St. Ignatius College Preparatory  |  Camera Locator V0.12  |  Rev 3 IFC 04/10/2026</div>
  </div>
</div>
<div id="cam-label"><span id="active-cam">—</span><span id="active-src"></span></div>
<div id="toggle-list" onclick="toggleList()" title="Toggle camera list">☰</div>
<div id="cam-list" id="list-panel"></div>
<div id="canvas-wrap" id="wrap"><canvas id="cv"></canvas></div>
<div id="loading">Loading floor plan...</div>
<div id="zoom-btns">
  <button onclick="zoom(1.3)">+</button>
  <button onclick="zoom(0.77)">−</button>
  <button onclick="resetView()" style="font-size:13px;">↺</button>
</div>
<script>
const IMG_W = 10368, IMG_H = 7776;
const CAMS = {
    "K02-01": {
        "x": 5994,
        "y": 5592,
        "source": "r3"
    },
    "K02-02": {
        "x": 5532,
        "y": 4962,
        "source": "rcp"
    },
    "K02-03": {
        "x": 5529,
        "y": 3843,
        "source": "rcp"
    },
    "K02-04": {
        "x": 6135,
        "y": 3981,
        "source": "rcp"
    },
    "K02-05": {
        "x": 5532,
        "y": 3057,
        "source": "rcp"
    }
};
const CAM_IDS = Object.keys(CAMS);

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const wrap = document.getElementById('canvas-wrap');
const listPanel = document.getElementById('cam-list');
const activeCamEl = document.getElementById('active-cam');
const activeSrcEl = document.getElementById('active-src');
const loadingEl = document.getElementById('loading');

// Initial scale: fit to viewport width
let scale = Math.min(0.15, (window.innerWidth - 220) / IMG_W);
let activeCam = null;
let imgLoaded = false;

// Read cam from URL — works whether opened directly or via hyperlink
const targetCam = new URLSearchParams(window.location.search).get('cam');

// Build sidebar list
CAM_IDS.forEach(kn => {
  const cam = CAMS[kn];
  const div = document.createElement('div');
  div.className = 'item';
  div.id = 'li-' + kn;
  const srcLabel = cam.source === 'rcp' ? 'RCP inferred' : cam.source === 'sca' ? 'SCA Rev3' : 'Rev3';
  div.innerHTML = '<div class="kn">' + kn + '</div><div class="src">' + srcLabel + '</div>';
  div.onclick = () => selectCam(kn);
  listPanel.appendChild(div);
});

// Load image
const img = new Image();
img.onload = () => {
  imgLoaded = true;
  loadingEl.style.display = 'none';
  // If a cam was requested via URL, zoom to it; otherwise show full sheet
  if (targetCam && CAMS[targetCam]) {
    // Zoom in closer for the targeted camera
    scale = 0.35;
    draw(targetCam);
    // Scroll so the camera is centred in the viewport
    const cam = CAMS[targetCam];
    const x = cam.x * scale;
    const y = cam.y * scale;
    // Use requestAnimationFrame to ensure canvas has painted before scrolling
    requestAnimationFrame(() => {
      wrap.scrollLeft = Math.max(0, x - wrap.clientWidth / 2);
      wrap.scrollTop  = Math.max(0, y - wrap.clientHeight / 2);
      // Highlight in sidebar
      activeCamEl.textContent = targetCam;
      const srcLabel = CAMS[targetCam].source === 'rcp' ? ' — assumed from RCP'
                      : CAMS[targetCam].source === 'sca' ? ' — SCA Rev3' : ' — Rev3 keynoted';
      activeSrcEl.textContent = srcLabel;
      activeCam = targetCam;
      const li = document.getElementById('li-' + targetCam);
      if (li) { li.classList.add('active'); li.scrollIntoView({block:'nearest'}); }
    });
  } else {
    draw();
  }
};
img.onerror = () => { loadingEl.textContent = 'Image failed to load.'; };
img.src = 'img_T2.12A.webp';

function draw(highlight=null) {
  const w = Math.round(IMG_W * scale), h = Math.round(IMG_H * scale);
  cv.width = w; cv.height = h;
  if (imgLoaded) ctx.drawImage(img, 0, 0, w, h);
  CAM_IDS.forEach(kn => {
    const cam = CAMS[kn];
    const x = cam.x * scale, y = cam.y * scale;
    const r = Math.max(8, 14 * scale);
    const isActive = kn === highlight;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2);
    ctx.fillStyle = isActive ? '#e91e8c' : 'rgba(233,30,140,0.4)';
    ctx.fill();
    ctx.strokeStyle = isActive ? '#fff' : '#e91e8c';
    ctx.lineWidth = isActive ? 2.5 : 1.5; ctx.stroke();
    if (isActive || scale > 0.18) {
      ctx.fillStyle = isActive ? '#fff' : '#e91e8c';
      ctx.font = `bold ${Math.max(9, Math.round(11*scale))}px Arial`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(kn, x, y - r - Math.max(6, 9*scale));
    }
  });
}

function selectCam(kn) {
  activeCam = kn;
  const cam = CAMS[kn];
  activeCamEl.textContent = kn;
  const srcLabel = cam.source === 'rcp' ? ' — assumed from RCP'
                  : cam.source === 'sca' ? ' — SCA Rev3' : ' — Rev3 keynoted';
  activeSrcEl.textContent = srcLabel;
  document.querySelectorAll('#cam-list .item').forEach(el => el.classList.remove('active'));
  const li = document.getElementById('li-' + kn);
  if (li) { li.classList.add('active'); li.scrollIntoView({block:'nearest'}); }
  draw(kn);
  requestAnimationFrame(() => {
    wrap.scrollLeft = Math.max(0, cam.x*scale - wrap.clientWidth/2);
    wrap.scrollTop  = Math.max(0, cam.y*scale - wrap.clientHeight/2);
  });
}

function zoom(f) {
  scale = Math.min(2.0, Math.max(0.05, scale * f));
  draw(activeCam);
  if (activeCam) {
    const cam = CAMS[activeCam];
    requestAnimationFrame(() => {
      wrap.scrollLeft = Math.max(0, cam.x*scale - wrap.clientWidth/2);
      wrap.scrollTop  = Math.max(0, cam.y*scale - wrap.clientHeight/2);
    });
  }
}

function resetView() {
  scale = Math.min(0.15, (window.innerWidth - 220) / IMG_W);
  activeCam = null;
  activeCamEl.textContent = '—';
  activeSrcEl.textContent = '';
  document.querySelectorAll('#cam-list .item').forEach(el => el.classList.remove('active'));
  draw();
  wrap.scrollLeft = 0; wrap.scrollTop = 0;
}

function toggleList() { document.body.classList.toggle('list-hidden'); draw(activeCam); }

// Drag to pan
let dragging=false, dx=0, dy=0;
wrap.addEventListener('mousedown', e=>{ dragging=true; dx=e.clientX+wrap.scrollLeft; dy=e.clientY+wrap.scrollTop; wrap.classList.add('grabbing'); });
window.addEventListener('mousemove', e=>{ if(dragging){ wrap.scrollLeft=dx-e.clientX; wrap.scrollTop=dy-e.clientY; } });
window.addEventListener('mouseup', ()=>{ dragging=false; wrap.classList.remove('grabbing'); });
wrap.addEventListener('wheel', e=>{ e.preventDefault(); zoom(e.deltaY<0?1.1:0.91); }, {passive:false});
</script>
</body>
</html>
