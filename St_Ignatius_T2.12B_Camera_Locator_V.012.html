<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>St. Ignatius — T2.12B Camera Locator</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Arial,sans-serif;background:#0f1923;color:#fff;height:100vh;display:flex;flex-direction:column;overflow:hidden;}
.header{background:#1A2A4A;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;border-bottom:3px solid #2C3E6E;}
.header h1{font-size:14px;font-weight:bold;}
.header p{font-size:11px;color:#aac;}
.badge{background:#E91E8C;color:#fff;padding:4px 10px;border-radius:12px;font-size:11px;font-weight:bold;}
.badge-added{background:#FF6F00;color:#fff;padding:4px 10px;border-radius:12px;font-size:11px;font-weight:bold;}
.main{display:flex;flex:1;overflow:hidden;}
.sidebar{width:220px;flex-shrink:0;background:#1a2535;border-right:1px solid #2C3E6E;overflow-y:auto;}
.sidebar-title{background:#2C3E6E;padding:8px 12px;font-size:11px;font-weight:bold;color:#aac;text-transform:uppercase;letter-spacing:1px;}
.cam-item{padding:8px 12px;border-bottom:1px solid #243040;cursor:pointer;display:flex;align-items:center;gap:8px;transition:background 0.15s;}
.cam-item:hover{background:#243a55;}
.cam-item.active{background:#1A2A4A;border-left:3px solid #E91E8C;}
.cam-item.added{border-left:3px solid #FF6F00;}
.cam-id{font-size:12px;font-weight:bold;color:#E91E8C;min-width:65px;}
.cam-attr{font-size:10px;background:#2C3E6E;color:#aac;padding:2px 6px;border-radius:3px;}
.star{color:#FF6F00;font-size:10px;}
.viewer{flex:1;position:relative;overflow:hidden;background:#111;}
#fp-container{position:absolute;top:0;left:0;transform-origin:0 0;transition:transform 0.3s cubic-bezier(0.4,0,0.2,1);}
#fp-img{display:block;max-width:none;}
.pin{position:absolute;transform:translate(-50%,-50%);cursor:pointer;z-index:10;}
.pin-circle{width:20px;height:20px;border-radius:50%;background:#E91E8C;border:2.5px solid #fff;display:flex;align-items:center;justify-content:center;font-size:6px;font-weight:bold;color:#fff;transition:all 0.2s;box-shadow:0 2px 8px rgba(233,30,140,0.7);}
.pin.added .pin-circle{background:#FF6F00;}
.pin.active .pin-circle{width:30px;height:30px;background:#fff;color:#E91E8C;font-size:9px;box-shadow:0 0 0 4px rgba(233,30,140,0.4),0 4px 16px rgba(233,30,140,0.9);}
.pin.added.active .pin-circle{color:#FF6F00;}
.pin-label{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);background:#1A2A4A;color:#fff;font-size:9px;font-weight:bold;padding:2px 6px;border-radius:4px;white-space:nowrap;opacity:0;transition:opacity 0.15s;pointer-events:none;border:1px solid #E91E8C;}
.pin:hover .pin-label,.pin.active .pin-label{opacity:1;}
.tooltip{position:fixed;background:#1A2A4A;border:1px solid #E91E8C;color:#fff;padding:10px 14px;border-radius:8px;font-size:12px;pointer-events:none;z-index:1000;display:none;box-shadow:0 4px 20px rgba(0,0,0,0.6);min-width:190px;}
.tooltip strong{color:#E91E8C;font-size:14px;display:block;margin-bottom:5px;}
.tooltip span{color:#aac;font-size:11px;display:block;line-height:1.7;}
.controls{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;gap:6px;z-index:20;}
.ctrl-btn{width:34px;height:34px;background:#1A2A4A;border:1px solid #2C3E6E;border-radius:6px;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.ctrl-btn:hover{background:#2C3E6E;}
.statusbar{background:#1A2A4A;padding:5px 16px;font-size:10px;color:#aac;display:flex;justify-content:space-between;flex-shrink:0;border-top:1px solid #2C3E6E;}
#loading{position:absolute;inset:0;background:#111;display:flex;align-items:center;justify-content:center;z-index:100;font-size:14px;color:#aac;}
</style>
</head>
<body>
<div class="header">
  <div>
    <h1>ST. IGNATIUS COLLEGE PREPARATORY — Security Camera Locator</h1>
    <p>Sheet T2.12B — Level 2 (North) &nbsp;|&nbsp; Dynamic Field Takeoff V.012 &nbsp;|&nbsp; May 2026</p>
  </div>
  <div style="display:flex;align-items:center;gap:10px;">
    <span class="badge">16 CAMERAS</span>
    <span class="badge-added">★ Added by Dynamic</span>
  </div>
</div>
<div class="main">
  <div class="sidebar">
    <div class="sidebar-title">Camera Index — T2.12B</div>
    <div id="cam-list"></div>
  </div>
  <div class="viewer" id="viewer">
    <div id="loading">Loading floor plan…</div>
    <div id="fp-container">
      <img id="fp-img" src="img_T2.12B.png" alt="T2.12B">
      <div id="pins" style="position:absolute;top:0;left:0;pointer-events:none;"></div>
    </div>
    <div class="controls">
      <button class="ctrl-btn" onclick="zoom(1.25)">+</button>
      <button class="ctrl-btn" onclick="zoom(0.8)">−</button>
      <button class="ctrl-btn" onclick="resetView()" style="font-size:13px;">⌂</button>
    </div>
    <div class="tooltip" id="tooltip"></div>
  </div>
</div>
<div class="statusbar">
  <span id="status">Loading…</span>
  <span>St. Ignatius College Preparatory &nbsp;|&nbsp; Dynamic &nbsp;|&nbsp; www.dystinc.com</span>
</div>
<script>
const CAMERAS = [{"id": "K02-06", "x": 11.951, "y": 42.607, "attr": "CFA", "mount": "FIXED IN CEILING", "fov": "DUAL IMAGER", "added": false}, {"id": "K02-07", "x": 9.392, "y": 64.663, "attr": "CFA", "mount": "FIXED IN CEILING", "fov": "DUAL IMAGER", "added": false}, {"id": "K02-08", "x": 18.312, "y": 67.334, "attr": "WF", "mount": "WALL FLUSH", "fov": "FIXED", "added": false}, {"id": "K02-09", "x": 24.306, "y": 54.246, "attr": "CP", "mount": "CEILING PENDANT", "fov": "180", "added": false}, {"id": "K02-10", "x": 32.472, "y": 49.57, "attr": "CFI", "mount": "IN CEILING", "fov": "180 FIXED", "added": true}, {"id": "K02-11", "x": 30.309, "y": 58.172, "attr": "TS", "mount": "TRAY MOUNT", "fov": "FIXED", "added": false}, {"id": "K02-12", "x": 32.694, "y": 71.422, "attr": "CFI", "mount": "IN CEILING", "fov": "180 FIXED", "added": false}, {"id": "K02-13", "x": 50.76, "y": 74.205, "attr": "CFA", "mount": "FIXED IN CEILING", "fov": "DUAL IMAGER", "added": false}, {"id": "K02-14", "x": 71.396, "y": 67.482, "attr": "CFA", "mount": "IN CEILING", "fov": "180 FIXED", "added": false}, {"id": "K02-15", "x": 68.712, "y": 82.191, "attr": "WF", "mount": "WALL FLUSH", "fov": "FIXED", "added": false}, {"id": "K02-16", "x": 72.573, "y": 80.556, "attr": "CP", "mount": "CEILING PENDANT", "fov": "FIXED", "added": false}, {"id": "K02-17", "x": 76.24, "y": 75.367, "attr": "CFA", "mount": "IN CEILING", "fov": "180 FIXED", "added": false}, {"id": "K02-18", "x": 84.615, "y": 78.955, "attr": "CFA", "mount": "IN CEILING", "fov": "360 FIXED", "added": false}, {"id": "K02-19", "x": 75.562, "y": 55.422, "attr": "CFA", "mount": "FIXED IN CEILING", "fov": "DUAL IMAGER", "added": false}, {"id": "K02-20", "x": 75.743, "y": 34.334, "attr": "CFA", "mount": "IN CEILING", "fov": "360 FIXED", "added": false}, {"id": "K02-21", "x": 68.788, "y": 23.552, "attr": "WS", "mount": "WALL SURFACE", "fov": "FIXED", "added": false}];
const camMap = {};
CAMERAS.forEach(c => camMap[c.id] = c);
const TARGET_ID = new URLSearchParams(window.location.search).get('cam') || '';

let scale=1,tx=0,ty=0,imgW=0,imgH=0;
const container=document.getElementById('fp-container');
const img=document.getElementById('fp-img');
const viewer=document.getElementById('viewer');
const pins=document.getElementById('pins');
const tooltip=document.getElementById('tooltip');

function applyT(x,y){tx=x;ty=y;container.style.transform=`translate(${x}px,${y}px) scale(${scale})`;}
function zoom(f){scale=Math.max(0.15,Math.min(10,scale*f));applyT(tx,ty);}
function resetView(){const vw=viewer.clientWidth,vh=viewer.clientHeight;scale=Math.min(vw/imgW,vh/imgH)*0.95;applyT((vw-imgW*scale)/2,(vh-imgH*scale)/2);setActive(null);document.getElementById('status').textContent='Click a camera in the list or tap a pin on the map';}

function navigateTo(cam){
  const vw=viewer.clientWidth,vh=viewer.clientHeight;
  scale=Math.min(vw/imgW,vh/imgH)*4.5;
  applyT(vw/2-(cam.x/100)*imgW*scale,vh/2-(cam.y/100)*imgH*scale);
  setActive(cam.id);
  document.getElementById('status').textContent=`${cam.id} — ${cam.attr} — ${cam.mount} — FOV: ${cam.fov}${cam.added?' ★ Added by Dynamic':''}`;
}

function setActive(id){
  document.querySelectorAll('.pin').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.cam-item').forEach(i=>i.classList.remove('active'));
  if(id){
    const pin=document.getElementById('pin-'+id);
    const item=document.getElementById('item-'+id);
    if(pin)pin.classList.add('active');
    if(item){item.classList.add('active');item.scrollIntoView({block:'nearest'});}
  }
}

img.onload=function(){
  imgW=img.naturalWidth;imgH=img.naturalHeight;
  pins.style.width=imgW+'px';pins.style.height=imgH+'px';
  CAMERAS.forEach(cam=>{
    const pin=document.createElement('div');
    pin.className='pin'+(cam.added?' added':'');
    pin.id='pin-'+cam.id;
    pin.style.left=cam.x+'%';pin.style.top=cam.y+'%';pin.style.pointerEvents='all';
    const num=cam.id.replace(/K0*\d+-/,'');
    pin.innerHTML=`<div class="pin-circle">${num}</div><div class="pin-label">${cam.id}</div>`;
    pin.addEventListener('click',()=>navigateTo(cam));
    pin.addEventListener('mouseenter',e=>{tooltip.innerHTML=`<strong>${cam.id}${cam.added?' ★':''}</strong><span>Type: ${cam.attr}</span><span>Mount: ${cam.mount}</span><span>FOV: ${cam.fov}</span>`;tooltip.style.display='block';tooltip.style.left=(e.clientX+14)+'px';tooltip.style.top=(e.clientY-10)+'px';});
    pin.addEventListener('mouseleave',()=>tooltip.style.display='none');
    pins.appendChild(pin);
  });
  [...CAMERAS].sort((a,b)=>a.id.localeCompare(b.id)).forEach(cam=>{
    const item=document.createElement('div');
    item.className='cam-item'+(cam.added?' added':'');
    item.id='item-'+cam.id;
    item.innerHTML=`<span class="cam-id">${cam.id}</span><span class="cam-attr">${cam.attr}</span>${cam.added?'<span class="star">★</span>':''}`;
    item.addEventListener('click',()=>navigateTo(cam));
    document.getElementById('cam-list').appendChild(item);
  });
  const vw=viewer.clientWidth,vh=viewer.clientHeight;
  scale=Math.min(vw/imgW,vh/imgH)*0.95;
  applyT((vw-imgW*scale)/2,(vh-imgH*scale)/2);
  document.getElementById('loading').style.display='none';
  if(TARGET_ID&&camMap[TARGET_ID]){navigateTo(camMap[TARGET_ID]);}
  else{document.getElementById('status').textContent='Click a camera in the list or tap a pin on the map';}
};

let dragging=false,dsx,dsy,dtx,dty;
viewer.addEventListener('mousedown',e=>{dragging=true;dsx=e.clientX;dsy=e.clientY;dtx=tx;dty=ty;});
window.addEventListener('mousemove',e=>{if(!dragging)return;applyT(dtx+e.clientX-dsx,dty+e.clientY-dsy);});
window.addEventListener('mouseup',()=>dragging=false);
viewer.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.1:0.9);},{passive:false});
</script>
</body>
</html>
